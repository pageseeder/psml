[versions]
junit = "5.14.4"
junit-platform = "1.14.4"
saxon = "12.10"
slf4j = "2.0.20"
xmlunit = "2.14.0"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
commons-io = { module = "commons-io:commons-io", version = "2.22.0" }
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0"}
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "junit-platform" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
pso-diffx = { module = "org.pageseeder.diffx:pso-diffx", version = "1.3.4" }
pso-xmlwriter = { module = "org.pageseeder.xmlwriter:pso-xmlwriter", version = "1.1.1" }
rhino-engine = { module = "org.mozilla:rhino-engine", version = "1.7.15.1" }
saxon-he = { module ="net.sf.saxon:Saxon-HE", version.ref = "saxon" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
xmlunit-core = { module = "org.xmlunit:xmlunit-core", version.ref = "xmlunit"}
xmlunit-matchers = { module = "org.xmlunit:xmlunit-matchers", version.ref = "xmlunit"}

[bundles]
junit = [
    "junit-jupiter-api",
    "junit-platform-launcher",
    "junit-platform-engine"
]

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version = "2.4.1" }
jreleaser = { id = "org.jreleaser", version = "1.27.0" }
sonar = { id = "org.sonarqube", version = "7.5.0.8588" }
versions = { id = "io.github.ben-manes.versions", version = "0.67.0" }
